[package]
name = "tapirus-ffi"
version = "1.2.1"
edition = "2024"
rust-version = "1.88"
authors = ["Ahmad Faiz <faiz@tapirusdb.com>"]
license = "BUSL-1.1"
description = "C Foreign Function Interface (FFI) bindings for TapirusDB"
repository = "https://github.com/tapiruslab/TapirusDB"

[lib]
name = "tapirus"
crate-type = ["cdylib", "staticlib"]

[dependencies]
tapirus = { version = "1.2.1", path = "../.." }
serde_json = "1.0"
