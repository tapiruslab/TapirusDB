[package]
name = "tapirus-wasm"
version = "1.2.1"
edition = "2024"
rust-version = "1.88"
authors = ["Ahmad Faiz <faiz@tapirusdb.com>"]
license = "BUSL-1.1"
description = "WebAssembly (WASM) bindings for TapirusDB embedded AI database engine"
repository = "https://github.com/tapiruslab/TapirusDB"
exclude = ["pkg/", "pkg-lite/", "node_modules/"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["quad"]
quad = ["tapirus/quad"]
lite = ["tapirus/edition-lite"]

[dependencies]
tapirus = { version = "1.2.1", path = "../..", default-features = false }
wasm-bindgen = "0.2"
serde_json = "1.0"
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

