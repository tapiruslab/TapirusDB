[package]
name = "tapirus-wasm"
version = "1.0.1"
edition = "2024"
authors = ["Ahmad Faiz <faiz@tapirusdb.com>"]
license = "BUSL-1.1"
description = "WebAssembly (WASM) bindings for TapirusDB embedded AI database engine"
repository = "https://github.com/tapiruslab/TapirusDB"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tapirus = { path = "../.." }
wasm-bindgen = "0.2"
serde_json = "1.0"
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

