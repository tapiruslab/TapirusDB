[package]
name = "tapirus-nodejs"
version = "1.0.2"
publish = false
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
crate-type = ["cdylib"]
# The addon requires a Node-API host; exercise it with the installed npm tests.
test = false
doctest = false

[dependencies]
napi = { version = "2.16.4", default-features = false, features = ["napi6"] }
napi-derive = "2.16.2"
tapirus = { version = "1.0.2", path = "../.." }
serde_json = "1"

[build-dependencies]
napi-build = "2.1.3"
