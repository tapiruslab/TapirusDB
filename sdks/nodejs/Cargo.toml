[package]
name = "tapirus-nodejs"
version = "1.0.1"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16.4", default-features = false, features = ["napi6"] }
napi-derive = "2.16.2"
tapirus = { path = "../.." }
serde_json = "1"

[build-dependencies]
napi-build = "2.1.3"
