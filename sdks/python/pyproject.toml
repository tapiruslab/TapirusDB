[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "tapirus"
version = "1.0.1"
description = "Official Python SDK for TapirusDB — Safe-Rust Quad-Model Embedded AI Database & Agent Memory Engine"
readme = "README.md"
authors = [{ name = "TapirusDB Contributors", email = "contact@tapirusdb.com" }]
license = { text = "MIT AND BUSL-1.1" }
requires-python = ">=3.10"
keywords = ["tapirus", "tapirusdb", "embedded", "database", "sqlite", "vector", "graph", "ai-memory", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://tapirusdb.com"
Documentation = "https://tapirusdb.com/docs.html"
Repository = "https://github.com/tapiruslab/TapirusDB"

[project.optional-dependencies]
onnx = ["onnxruntime>=1.20,<2", "tokenizers>=0.20,<1", "numpy>=1.26,<3"]

[tool.maturin]
python-source = "python"
module-name = "tapirus.tapirus"
python-packages = ["tapirus", "tapirus_tools"]
include = [
    { path = "CORE_LICENSE", format = ["wheel", "sdist"] },
    { path = "NOTICE", format = ["wheel", "sdist"] },
]
exclude = [
    "python/**/__pycache__/**",
    "python/**/*.pyc",
]

[project.scripts]
tapirus-migrate = "tapirus_tools.migrate:main"
tapirus-agent = "tapirus_tools.agent:main"
tapirus-eval = "tapirus_tools.evaluate:main"
