[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "tapirus"
version = "1.0.1"
description = "Official Python SDK for TapirusDB — Safe-Rust Quad-Model Embedded AI Database & Agent Memory Engine"
readme = "README.md"
authors = [{ name = "Ahmad Faiz", email = "faiz@tapirusdb.com" }]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["tapirus", "tapirusdb", "embedded", "database", "sqlite", "vector", "graph", "ai-memory", "rag"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://tapirusdb.com"
Documentation = "https://tapirusdb.com/docs.html"
Repository = "https://github.com/tapiruslab/TapirusDB"
