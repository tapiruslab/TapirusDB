[package]
name = "tapirus-python"
version = "1.0.2"
edition = "2021"
license = "MIT"

[lib]
name = "tapirus"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
serde_json = "1.0"
serde = "1.0"
tapirus = { version = "1.0.2", path = "../.." }
