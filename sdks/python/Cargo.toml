[package]
name = "tapirus-python"
version = "1.0.5"
publish = false
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Native Python bindings for the TapirusDB embedded database"
repository = "https://github.com/tapiruslab/TapirusDB"

[lib]
name = "tapirus_python"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py310"] }
serde_json = "1.0"
serde = "1.0"
tapirus = { version = "1.0.5", path = "../.." }
