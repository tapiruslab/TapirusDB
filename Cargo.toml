[package]
name = "tapirus"
version = "1.0.1"
edition = "2024"
authors = ["TapirusDB Contributors <contact@tapirusdb.com>"]
license = "BUSL-1.1"
description = "The Safe-Rust Embedded Multi-Model Database & AI Agent Memory Engine"
repository = "https://github.com/tapiruslab/TapirusDB"
homepage = "https://tapirusdb.com"
documentation = "https://docs.rs/tapirus"
readme = "README.md"
keywords = ["embedded", "database", "sqlite", "vector", "ai-memory"]
categories = ["database-implementations", "embedded"]
rust-version = "1.85"
exclude = [
    "docs/formal_verification/",
    "scratch/",
]

[workspace]
members = [
    ".",
    "crates/tapirus-ffi",
    "crates/tapirus-wasm",
    "sdks/python",
    "sdks/nodejs"
]
default-members = [
    ".",
    "crates/tapirus-ffi",
    "crates/tapirus-wasm"
]

[[bin]]
name = "tapirus"
path = "src/bin/tapirus.rs"

[[bench]]
name = "tapirus_bench"
harness = false

[[bench]]
name = "head_to_head"
harness = false

[dependencies]
# Concurrency & Locks
parking_lot = "0.12"

# Checksums & Data Integrity
crc32fast = "1.4"

# Encryption at Rest (AEAD ChaCha20-Poly1305 & SHA256 Key Derivation)
chacha20poly1305 = "0.10"
sha2 = "0.10"
subtle = "2.6"

# Serialization & Deserialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

# Error Handling
thiserror = "2.0"

# Optional SIMD Vector Math
wide = { version = "0.7", optional = true }
getrandom = "0.4.3"
ureq = { version = "2.10", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom-02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3.14"

[features]
# Flagship Default: Complete Quad-Model Engine
default = ["quad"]

# Core Data Model Building Blocks
sql = []
vectors = []
graphs = []
documents = []
realtime = []
tap = []
server = []

# =========================================================================
# Official Brand-Sovereign Edition Profiles
# =========================================================================
# 1. Tapirus Lite — Ultra-compact embedded relational engine (< 500 KB)
edition-lite = ["sql", "std"]
lite = ["edition-lite"]

# 2. Tapirus Document — Pure schemaless JSON/BSON document collections
edition-document = ["documents", "sql", "std"]
document = ["edition-document"]

# 3. Tapirus AI Brain — Cognitive Agent Memory (Vectors + GraphRAG + Tap Instinct)
edition-ai-brain = ["vectors", "graphs", "tap", "std"]
ai-brain = ["edition-ai-brain"]

# 4. Tapirus Quad (Default Flagship) — Complete Quad-Model Consolidation
quad = ["sql", "vectors", "graphs", "documents", "realtime", "tap", "std"]

# 5. Tapirus Enterprise — Full Quad-Model + Daemon Server & Protocol Bridges
edition-enterprise = ["quad", "server"]
enterprise = ["edition-enterprise"]

std = []
simd = ["dep:wide"]
tap-deep = []
cloud-s3 = ["dep:ureq"]

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Ultra-compact profile for Edge IoT, Microcontrollers, and Embedded Linux
[profile.min-size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
