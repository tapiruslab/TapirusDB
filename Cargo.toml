[package]
name = "tapirus"
version = "1.0.2"
edition = "2024"
authors = ["TapirusDB Contributors <contact@tapirusdb.com>"]
license = "BUSL-1.1"
description = "The Safe-Rust Embedded Multi-Model Database & AI Agent Memory Engine"
repository = "https://github.com/tapiruslab/TapirusDB"
homepage = "https://tapirusdb.com"
documentation = "https://docs.rs/tapirus"
readme = "README.md"
keywords = ["embedded", "database", "sqlite", "vector", "ai-memory"]
categories = ["database-implementations", "embedded"]
rust-version = "1.85"
exclude = [
    "docs/formal_verification/",
    "scratch/",
    # Separate legacy ctypes integration; avoids mixed-wheel source path collision.
    "python/",
]

[workspace]
members = [
    ".",
    "crates/tapirus-ffi",
    "crates/tapirus-wasm",
    "crates/tapirus-micro",
    "sdks/python",
    "sdks/nodejs"
]
default-members = [
    ".",
    "crates/tapirus-ffi",
    "crates/tapirus-wasm"
]

[[bin]]
name = "tapirus"
path = "src/bin/tapirus.rs"

[[bin]]
name = "tapirus-lite"
path = "src/bin/tapirus-lite.rs"
required-features = ["edition-lite"]

[[bin]]
name = "tapirus-document"
path = "src/bin/tapirus-document.rs"
required-features = ["edition-document"]

[[bin]]
name = "tapirus-graph"
path = "src/bin/tapirus-graph.rs"
required-features = ["edition-graph"]

[[bin]]
name = "tapirus-vector"
path = "src/bin/tapirus-vector.rs"
required-features = ["edition-vector"]

[[bin]]
name = "tapirus-iot"
path = "src/bin/tapirus-iot.rs"
required-features = ["quad"]

[[bench]]
name = "tapirus_bench"
harness = false

[[bench]]
name = "head_to_head"
harness = false

[[bench]]
name = "release_readiness"
harness = false

[[bench]]
name = "memory_scale"
harness = false

[dependencies]
tapirus-micro = { version = "1.0.2", path = "crates/tapirus-micro", optional = true }
# Concurrency & Locks
parking_lot = "0.12"

# Checksums & Data Integrity
crc32fast = "1.4"

# Encryption at Rest (AEAD ChaCha20-Poly1305 & SHA256 Key Derivation)
chacha20poly1305 = "0.10"
# 0.11.1 raises MSRV to Rust 1.88; pin 0.11.0 while this crate promises 1.85.
# Cargo.lock currently resolves patched block-buffer 0.12.1; OSV gates updates.
sha2 = "=0.11.0"
subtle = "2.6"

# Serialization & Deserialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

# Error Handling
thiserror = "2.0"
web-time = "1.1"

# Optional SIMD Vector Math
wide = { version = "0.7", optional = true }
getrandom = "0.4.3"
ureq = { version = "2.10", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom-02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3.14"

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3.14"

[features]
# Flagship Default: Complete Quad-Model Engine
default = ["quad"]

# Core Data Model Building Blocks
sql = []
vectors = []
graphs = []
documents = []
realtime = []
tap = []
server = []

# =========================================================================
# Official Brand-Sovereign Edition Profiles
# =========================================================================
# 1. Tapirus Lite — Embedded relational feature profile (requires std)
edition-lite = ["sql", "std"]
lite = ["edition-lite"]

# 2. Tapirus Document — Schemaless JSON document collections
edition-document = ["documents", "sql", "std"]
document = ["edition-document"]

# Single-model graph and vector entry points, using the shared SQL pager internally.
edition-graph = ["graphs", "sql", "std"]
graph-only = ["edition-graph"]
edition-vector = ["vectors", "sql", "std"]
vector-only = ["edition-vector"]

# 3. Tapirus AI Brain — Cognitive Agent Memory (Vectors + GraphRAG + Tap Instinct)
edition-ai-brain = ["vectors", "graphs", "tap", "sql", "std"]
ai-brain = ["edition-ai-brain"]

# 4. Tapirus Quad (Default Flagship) — Complete Quad-Model Consolidation
quad = ["sql", "vectors", "graphs", "documents", "realtime", "tap", "simd", "std", "dep:tapirus-micro"]

# 5. Tapirus Enterprise — Full Quad-Model + Daemon Server & Protocol Bridges
edition-enterprise = ["quad", "server"]
enterprise = ["edition-enterprise"]

std = []
simd = ["dep:wide"]
tap-deep = []
cloud-s3 = ["dep:ureq"]
http-embeddings = ["dep:ureq"]
fault-injection = []

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Size-oriented native profile. Bare-metal targets use crates/tapirus-micro.
[profile.min-size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
