[package]
name = "tapirus"
version = "1.0.5"
edition = "2024"
authors = ["TapirusDB Contributors <contact@tapirusdb.com>"]
license = "BUSL-1.1"
description = "Embedded multi-model database with SQL, vector search and local AI memory"
repository = "https://github.com/tapiruslab/TapirusDB"
homepage = "https://tapirusdb.com"
documentation = "https://docs.rs/tapirus"
readme = "README.md"
keywords = ["embedded", "database", "sqlite", "vector", "ai-memory"]
categories = ["database-implementations", "embedded"]
rust-version = "1.88"
exclude = [
    "docs/formal_verification/",
    "scratch/",
    # Separate legacy ctypes integration; avoids mixed-wheel source path collision.
    "python/",
]

[workspace]
members = [
    ".",
    "crates/tapirus-ffi",
    "crates/tapirus-wasm",
    "crates/tapirus-micro",
    "sdks/python",
    "sdks/nodejs"
]
default-members = [
    ".",
    "crates/tapirus-ffi",
    "crates/tapirus-wasm"
]

[[bin]]
name = "tapirus"
path = "src/bin/tapirus.rs"

[[bin]]
name = "tapirus-lite"
path = "src/bin/tapirus-lite.rs"
required-features = ["edition-lite"]

[[bin]]
name = "tapirus-document"
path = "src/bin/tapirus-document.rs"
required-features = ["edition-document"]

[[bin]]
name = "tapirus-graph"
path = "src/bin/tapirus-graph.rs"
required-features = ["edition-graph"]

[[bin]]
name = "tapirus-vector"
path = "src/bin/tapirus-vector.rs"
required-features = ["edition-vector"]

[[bin]]
name = "tapirus-iot"
path = "src/bin/tapirus-iot.rs"
required-features = ["quad"]

[[bench]]
name = "tapirus_bench"
harness = false

[[bench]]
name = "head_to_head"
harness = false

[[bench]]
name = "release_readiness"
harness = false

[[bench]]
name = "memory_scale"
harness = false

[dependencies]
tapirus-micro = { version = "1.0.5", path = "crates/tapirus-micro", optional = true }
# Concurrency & Locks
parking_lot = "0.12"

# Checksums & Data Integrity
crc32fast = "1.4"

# Encryption at Rest (AEAD ChaCha20-Poly1305 & SHA256 Key Derivation)
# Requires MSRV Rust 1.88+ for patched ctutils (>=0.4.4) and sha2 (>=0.11.1).
chacha20poly1305 = "0.11"
sha2 = "0.11.1"
subtle = "2.6"
zeroize = { version = "1.9", default-features = false }

# Serialization & Deserialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

# Error Handling
thiserror = "2.0"
web-time = "1.1"

# Optional SIMD Vector Math
wide = { version = "0.7", optional = true }
getrandom = "0.4.3"
ureq = { version = "3.5", optional = true }

# Optional Big Data, Data Lake & Document Ingestion (Pure Rust where possible)
parquet = { version = "60.1", default-features = false, features = ["arrow", "snap", "brotli", "flate2-zlib-rs", "lz4", "base64", "simdutf8"], optional = true }
arrow-array = { version = "60.1", default-features = false, optional = true }
arrow-schema = { version = "60.1", default-features = false, optional = true }
flate2 = { version = "1.0", default-features = false, features = ["zlib-rs"], optional = true }
lopdf = { version = "0.47", default-features = false, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom-02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pki-types = { version = "1.15", optional = true }

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3.14"

[features]
# Flagship Default: Complete Quad-Model Engine + Native TLS Server + Lakehouse Analytics
default = ["quad", "tls", "lakehouse"]

# Core Data Model Building Blocks
sql = []
vectors = []
graphs = []
documents = []
realtime = []
tap = []
server = ["tls"]

# =========================================================================
# Official Brand-Sovereign Edition Profiles
# =========================================================================
# 1. Tapirus Lite — Embedded relational feature profile (requires std)
edition-lite = ["sql", "std"]
lite = ["edition-lite"]

# 2. Tapirus Document — Schemaless JSON document collections
edition-document = ["documents", "sql", "std"]
document = ["edition-document"]

# Single-model graph and vector entry points, using the shared SQL pager internally.
edition-graph = ["graphs", "sql", "std"]
graph-only = ["edition-graph"]
edition-vector = ["vectors", "sql", "std"]
vector-only = ["edition-vector"]

# 3. Tapirus AI Brain — Cognitive Agent Memory (Vectors + GraphRAG + Tap Instinct)
edition-ai-brain = ["vectors", "graphs", "tap", "sql", "std"]
ai-brain = ["edition-ai-brain"]

# 4. Tapirus Quad (Default Flagship) — Complete Quad-Model Consolidation
quad = ["sql", "vectors", "graphs", "documents", "realtime", "tap", "simd", "std", "dep:tapirus-micro"]

# 5. Tapirus Enterprise — Full Quad-Model + Daemon Server & Protocol Bridges
edition-enterprise = ["quad", "server"]
enterprise = ["edition-enterprise"]

tls = ["dep:rustls", "dep:rustls-pki-types"]
std = []
simd = ["dep:wide"]
tap-deep = []
cloud-s3 = ["dep:ureq"]
http-embeddings = ["dep:ureq"]
lakehouse = ["std", "dep:parquet", "dep:arrow-array", "dep:arrow-schema", "dep:flate2", "dep:lopdf"]
fault-injection = []

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Size-oriented native profile. Bare-metal targets use crates/tapirus-micro.
[profile.min-size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
