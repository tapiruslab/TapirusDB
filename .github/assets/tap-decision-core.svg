<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 500" width="100%" height="100%" style="background:#FFFFFF; border-radius:16px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif;">
  <defs>
    <!-- Background Grid -->
    <pattern id="gridPattern" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#F1F5F9" stroke-width="1"/>
    </pattern>

    <!-- Subtle Drop Shadows -->
    <filter id="softShadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <!-- Panel Gradients (Light Mode) -->
    <linearGradient id="badPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8F8"/>
      <stop offset="100%" stop-color="#FFF1F2"/>
    </linearGradient>

    <linearGradient id="goodPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6FDF9"/>
      <stop offset="100%" stop-color="#EDFDF5"/>
    </linearGradient>

    <linearGradient id="blueAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrowRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#E11D48"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1140" height="500" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect width="1140" height="500" fill="url(#gridPattern)"/>

  <!-- ================= LEFT PANEL: TRADITIONAL EXTERNAL LLM STACK ================= -->
  <g transform="translate(28, 22)">
    <rect width="520" height="456" rx="14" fill="url(#badPanel)" stroke="#FECDD3" stroke-width="1.4" filter="url(#softShadow)"/>

    <!-- Header Badge -->
    <rect x="22" y="18" width="220" height="24" rx="12" fill="#FFE4E6" stroke="#FDA4AF" stroke-width="1"/>
    <circle cx="34" cy="30" r="3.5" fill="#E11D48"/>
    <text x="44" y="34" fill="#9F1239" font-size="10" font-weight="700" letter-spacing="0.6">THE 500MS NETWORK TAX</text>

    <!-- Title & Subtitle -->
    <text x="22" y="66" fill="#0F172A" font-size="18" font-weight="700">External LLM Pipeline</text>
    <text x="22" y="84" fill="#64748B" font-size="11.5">App serializes DB rows over network pipes to external AI services</text>

    <!-- Step 1: Database Query -->
    <g transform="translate(22, 100)">
      <rect width="476" height="42" rx="7" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="20" cy="21" r="9" fill="#F1F5F9"/>
      <text x="20" y="25" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">1</text>
      <text x="38" y="19" fill="#0F172A" font-size="11.5" font-weight="700">Database Query &amp; Fetch</text>
      <text x="38" y="33" fill="#64748B" font-size="10">SELECT raw text rows via network socket</text>
      <rect x="390" y="10" width="76" height="22" rx="4" fill="#FFF1F2" stroke="#FECDD3" stroke-width="0.8"/>
      <text x="428" y="25" fill="#E11D48" font-size="10" font-weight="700" text-anchor="middle">10–25 ms</text>
    </g>

    <!-- Step 2: Serialization & Network Egress -->
    <g transform="translate(22, 150)">
      <rect width="476" height="42" rx="7" fill="#FFF5F5" stroke="#FCA5A5" stroke-dasharray="4,3" stroke-width="1"/>
      <circle cx="20" cy="21" r="9" fill="#FEE2E2"/>
      <text x="20" y="25" fill="#B91C1C" font-size="10.5" font-weight="700" text-anchor="middle">2</text>
      <text x="38" y="19" fill="#0F172A" font-size="11.5" font-weight="700">JSON Serialization &amp; HTTPS Egress</text>
      <text x="38" y="33" fill="#B91C1C" font-size="10">Pack into massive prompt, TLS handshake, Internet roundtrip</text>
      <rect x="390" y="10" width="76" height="22" rx="4" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="0.8"/>
      <text x="428" y="25" fill="#B91C1C" font-size="10" font-weight="700" text-anchor="middle">60–120 ms</text>
    </g>

    <!-- Step 3: Remote LLM / Heavy Container -->
    <g transform="translate(22, 200)">
      <rect width="476" height="74" rx="7" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1"/>
      <circle cx="20" cy="25" r="9" fill="#FEE2E2"/>
      <text x="20" y="29" fill="#BE123C" font-size="10.5" font-weight="700" text-anchor="middle">3</text>
      <text x="38" y="22" fill="#0F172A" font-size="11.5" font-weight="700">Cloud LLM / vLLM Inference</text>
      <text x="38" y="38" fill="#64748B" font-size="10">Autoregressive token generation on remote GPUs</text>
      <text x="38" y="58" fill="#E11D48" font-size="9.5" font-weight="600">⚠️ Risk of hallucination, rate-limits (429), and JSON parse failure</text>
      <rect x="380" y="12" width="86" height="22" rx="4" fill="#FFE4E6" stroke="#FDA4AF" stroke-width="0.8"/>
      <text x="423" y="27" fill="#9F1239" font-size="10" font-weight="700" text-anchor="middle">350–800 ms</text>
    </g>

    <!-- Step 4: Writeback & Validation -->
    <g transform="translate(22, 282)">
      <rect width="476" height="42" rx="7" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="20" cy="21" r="9" fill="#F1F5F9"/>
      <text x="20" y="25" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">4</text>
      <text x="38" y="19" fill="#0F172A" font-size="11.5" font-weight="700">JSON Parsing &amp; Database Writeback</text>
      <text x="38" y="33" fill="#64748B" font-size="10">Extract classification, execute UPDATE query</text>
      <rect x="390" y="10" width="76" height="22" rx="4" fill="#FFF1F2" stroke="#FECDD3" stroke-width="0.8"/>
      <text x="428" y="25" fill="#E11D48" font-size="10" font-weight="700" text-anchor="middle">20–45 ms</text>
    </g>

    <!-- Bottleneck Summary Bar -->
    <g transform="translate(22, 336)">
      <rect width="476" height="100" rx="8" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1"/>
      <text x="16" y="22" fill="#9F1239" font-size="11" font-weight="700">SYSTEM PERFORMANCE BOTTLENECK</text>
      
      <g transform="translate(16, 32)">
        <text x="0" y="14" fill="#64748B" font-size="10">Avg Row Latency:</text>
        <text x="100" y="14" fill="#BE123C" font-size="11" font-weight="700">450 ms – 1,000+ ms</text>

        <text x="0" y="32" fill="#64748B" font-size="10">Token Cost / 100k:</text>
        <text x="100" y="32" fill="#BE123C" font-size="11" font-weight="700">~$150.00 – $300.00</text>

        <text x="240" y="14" fill="#64748B" font-size="10">Memory Overhead:</text>
        <text x="340" y="14" fill="#BE123C" font-size="11" font-weight="700">1.2 GB+ (Torch/vLLM)</text>

        <text x="240" y="32" fill="#64748B" font-size="10">Determinism:</text>
        <text x="340" y="32" fill="#BE123C" font-size="11" font-weight="700">Stochastic (Flaky)</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT PANEL: TAPIRUSDB TAP DECISION CORE ================= -->
  <g transform="translate(592, 22)">
    <rect width="520" height="456" rx="14" fill="url(#goodPanel)" stroke="#A7F3D0" stroke-width="1.4" filter="url(#softShadow)"/>

    <!-- Header Badge -->
    <rect x="22" y="18" width="220" height="24" rx="12" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
    <circle cx="34" cy="30" r="3.5" fill="#059669"/>
    <text x="44" y="34" fill="#166534" font-size="10" font-weight="700" letter-spacing="0.6">NATIVE IN-PROCESS COGNITION</text>

    <!-- Title & Subtitle -->
    <text x="22" y="66" fill="#0F172A" font-size="18" font-weight="700">TapirusDB: Tap Decision Core</text>
    <text x="22" y="84" fill="#047857" font-size="11.5">Instant System-1 decision primitives executed directly inside SQL</text>

    <!-- Unified Cognitive Engine Card -->
    <g transform="translate(22, 100)">
      <rect width="476" height="224" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-opacity="0.35" stroke-width="1.2"/>

      <!-- SQL Query Banner -->
      <g transform="translate(14, 12)">
        <rect width="448" height="32" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <text x="12" y="20" fill="#0F172A" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600">
          SELECT id, <tspan fill="#2563EB">TAP_CLASSIFY</tspan>(body, '[...]') WHERE <tspan fill="#059669">TAP_VERIFY</tspan>(...) = 1
        </text>
      </g>

      <!-- Internal Pipeline (Zero-Copy) -->
      <g transform="translate(14, 52)">
        <!-- Step A: Buffer Pool Zero Copy -->
        <g transform="translate(0, 0)">
          <rect width="448" height="44" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="0.8"/>
          <text x="14" y="19" fill="#065F46" font-size="11" font-weight="700">1. Zero-Copy 4KB Buffer Pool Access</text>
          <text x="14" y="33" fill="#047857" font-size="9.5">Data accessed directly in RAM. Zero JSON serialization. Zero network sockets.</text>
          <rect x="368" y="11" width="68" height="20" rx="4" fill="#DCFCE7"/>
          <text x="402" y="25" fill="#15803D" font-size="9.5" font-weight="700" text-anchor="middle">&lt; 0.05 ms</text>
        </g>

        <!-- Step B: Safe-Rust SIMD & Semantic Projection -->
        <g transform="translate(0, 50)">
          <rect width="448" height="54" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="0.8"/>
          <text x="14" y="19" fill="#065F46" font-size="11" font-weight="700">2. Tap System-1 Decision Head (#![forbid(unsafe_code)])</text>
          <text x="14" y="33" fill="#047857" font-size="9.5">• In-memory Subword Tokenizer + SIMD Lexical Overlap</text>
          <text x="14" y="46" fill="#047857" font-size="9.5">• Zero-allocation Dense Semantic Cosine Head + Calibrated Thresholds</text>
          <rect x="368" y="16" width="68" height="20" rx="4" fill="#DCFCE7"/>
          <text x="402" y="30" fill="#15803D" font-size="9.5" font-weight="700" text-anchor="middle">&lt; 0.45 ms</text>
        </g>

        <!-- Step C: Storage Filter Pushdown -->
        <g transform="translate(0, 110)">
          <rect width="448" height="44" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="0.8"/>
          <text x="14" y="19" fill="#065F46" font-size="11" font-weight="700">3. SQL Filter Pushdown &amp; ACID Stream</text>
          <text x="14" y="33" fill="#047857" font-size="9.5">WHERE predicate prunes invalid records before disk I/O. ACID consistency.</text>
          <rect x="368" y="11" width="68" height="20" rx="4" fill="#DCFCE7"/>
          <text x="402" y="25" fill="#15803D" font-size="9.5" font-weight="700" text-anchor="middle">&lt; 0.10 ms</text>
        </g>
      </g>
    </g>

    <!-- Tap Advantage Summary Bar -->
    <g transform="translate(22, 336)">
      <rect width="476" height="100" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
      <text x="16" y="22" fill="#065F46" font-size="11" font-weight="700">PROVEN EMPIRICAL PERFORMANCE</text>
      
      <g transform="translate(16, 32)">
        <text x="0" y="14" fill="#047857" font-size="10">Decision Latency:</text>
        <text x="100" y="14" fill="#065F46" font-size="11" font-weight="700">&lt; 1 ms (0.18 ms release)</text>

        <text x="0" y="32" fill="#047857" font-size="10">Token Cost / 100k:</text>
        <text x="100" y="32" fill="#065F46" font-size="11" font-weight="700">$0.00 (Zero Token Tax)</text>

        <text x="240" y="14" fill="#047857" font-size="10">Memory Overhead:</text>
        <text x="340" y="14" fill="#065F46" font-size="11" font-weight="700">&lt; 4 MB (Zero Torch)</text>

        <text x="240" y="32" fill="#047857" font-size="10">Determinism:</text>
        <text x="340" y="32" fill="#065F46" font-size="11" font-weight="700">100% Deterministic</text>
      </g>
    </g>
  </g>
</svg>
