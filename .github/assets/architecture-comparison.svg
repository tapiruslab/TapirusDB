<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#0a0d14; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#141a26" stroke-width="1"/>
    </pattern>

    <!-- Gradients -->
    <linearGradient id="badCardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1214"/>
      <stop offset="100%" stop-color="#120d0f"/>
    </linearGradient>

    <linearGradient id="goodCardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1f19"/>
      <stop offset="100%" stop-color="#081410"/>
    </linearGradient>

    <linearGradient id="emeraldBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="480" rx="12" fill="#090d16"/>
  <rect width="960" height="480" rx="12" fill="url(#grid)"/>

  <!-- ================= LEFT PANEL: TRADITIONAL FRANKENSTACK ================= -->
  <g transform="translate(32, 28)">
    <!-- Outer Container -->
    <rect width="410" height="424" rx="10" fill="url(#badCardGrad)" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.5"/>

    <!-- Header Badge -->
    <rect x="18" y="18" width="170" height="24" rx="4" fill="#361014"/>
    <text x="26" y="34" fill="#f87171" font-size="11" font-weight="700" letter-spacing="0.5">❌ THE FRAGILE FRANKENSTACK</text>
    <text x="18" y="60" fill="#94a3b8" font-size="12">Fragmented Multi-Database Architecture</text>

    <!-- App Node -->
    <rect x="20" y="80" width="105" height="230" rx="8" fill="#182234" stroke="#334155" stroke-width="1"/>
    <text x="72" y="180" fill="#f1f5f9" font-size="12" font-weight="600" text-anchor="middle">Your</text>
    <text x="72" y="198" fill="#f1f5f9" font-size="12" font-weight="600" text-anchor="middle">Application</text>
    <text x="72" y="218" fill="#64748b" font-size="10" text-anchor="middle">Process</text>

    <!-- Network Pipes (Dashed) -->
    <!-- Line 1: Vector -->
    <path d="M 125 118 L 220 118" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,4"/>
    <polygon points="220,118 214,115 214,121" fill="#f87171"/>
    <rect x="135" y="104" width="76" height="15" rx="3" fill="#2d1216"/>
    <text x="173" y="115" fill="#fca5a5" font-size="9" font-weight="600" text-anchor="middle">gRPC (20-50ms)</text>

    <!-- Cloud Vector DB Card -->
    <rect x="220" y="90" width="170" height="56" rx="6" fill="#171e2e" stroke="#475569" stroke-width="1"/>
    <text x="232" y="112" fill="#f8fafc" font-size="12" font-weight="600">☁️ Cloud Vector DB</text>
    <text x="232" y="132" fill="#f87171" font-size="10">~500 MB RAM • $$$/mo API</text>

    <!-- Line 2: Graph -->
    <path d="M 125 195 L 220 195" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,4"/>
    <polygon points="220,195 214,192 214,198" fill="#f87171"/>
    <rect x="135" y="181" width="76" height="15" rx="3" fill="#2d1216"/>
    <text x="173" y="192" fill="#fca5a5" font-size="9" font-weight="600" text-anchor="middle">HTTP (15-30ms)</text>

    <!-- Graph DB Card -->
    <rect x="220" y="167" width="170" height="56" rx="6" fill="#171e2e" stroke="#475569" stroke-width="1"/>
    <text x="232" y="189" fill="#f8fafc" font-size="12" font-weight="600">☕ Graph Database</text>
    <text x="232" y="209" fill="#f87171" font-size="10">~1.2 GB RAM • JVM Heavy</text>

    <!-- Line 3: SQL -->
    <path d="M 125 272 L 220 272" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,4"/>
    <polygon points="220,272 214,269 214,275" fill="#f87171"/>
    <rect x="135" y="258" width="76" height="15" rx="3" fill="#2d1216"/>
    <text x="173" y="269" fill="#fca5a5" font-size="9" font-weight="600" text-anchor="middle">TCP IPC (5-10ms)</text>

    <!-- Relational SQL Card -->
    <rect x="220" y="244" width="170" height="56" rx="6" fill="#171e2e" stroke="#475569" stroke-width="1"/>
    <text x="232" y="266" fill="#f8fafc" font-size="12" font-weight="600">🐬 Relational SQL</text>
    <text x="232" y="286" fill="#f87171" font-size="10">~350 MB RAM • OS Daemons</text>

    <!-- Metric Footer -->
    <rect x="18" y="330" width="374" height="74" rx="6" fill="#1a0f12" stroke="#ef4444" stroke-width="0.8" stroke-opacity="0.3"/>
    <text x="32" y="352" fill="#fca5a5" font-size="11" font-weight="700">Cumulative Overhead &amp; Pain Points:</text>
    <text x="32" y="372" fill="#cbd5e1" font-size="11">⏱️ Latency: <tspan fill="#f87171" font-weight="700">40–90 ms</tspan> per request cycle</text>
    <text x="32" y="390" fill="#cbd5e1" font-size="11">💾 RAM: <tspan fill="#f87171" font-weight="700">&gt; 2.0 GB idle</tspan> • Fragile ETL sync lag &amp; drift</text>
  </g>

  <!-- ================= VS BADGE ================= -->
  <g transform="translate(480, 240)">
    <circle r="22" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="0" y="5" fill="#f8fafc" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">VS</text>
  </g>

  <!-- ================= RIGHT PANEL: TAPIRUSDB UNIFIED ENGINE ================= -->
  <g transform="translate(518, 28)">
    <!-- Outer Glow Box -->
    <rect width="410" height="424" rx="10" fill="url(#goodCardGrad)" stroke="url(#emeraldBorder)" stroke-width="1.8"/>

    <!-- Header Badge -->
    <rect x="18" y="18" width="160" height="24" rx="4" fill="#063524"/>
    <text x="26" y="34" fill="#34d399" font-size="11" font-weight="700" letter-spacing="0.5">⚡ TAPIRUSDB UNIFIED</text>
    <text x="18" y="60" fill="#94a3b8" font-size="12">Zero-Network, In-Process Quad-Model Architecture</text>

    <!-- Application Process Wrapper -->
    <rect x="18" y="78" width="374" height="236" rx="8" fill="#0d1b1e" stroke="#059669" stroke-width="1" stroke-opacity="0.4"/>
    <text x="30" y="98" fill="#34d399" font-size="11" font-weight="700">YOUR APPLICATION RUNTIME PROCESS</text>
    <text x="30" y="112" fill="#64748b" font-size="10">(Rust, Python, Node.js, Go, PHP, Bun, Edge Worker)</text>

    <!-- Embedded Quad Core Engine Inside Process -->
    <rect x="28" y="124" width="354" height="114" rx="6" fill="#132a26" stroke="#10b981" stroke-width="1.2"/>
    <text x="40" y="146" fill="#ffffff" font-size="12" font-weight="700">🦛 TapirusDB Core (100% Safe Rust)</text>

    <!-- 4 Sub-models Badges -->
    <g transform="translate(38, 158)">
      <rect width="76" height="26" rx="4" fill="#064e3b"/>
      <text x="38" y="17" fill="#6ee7b7" font-size="10" font-weight="600" text-anchor="middle">📊 SQL-92</text>
    </g>
    <g transform="translate(122, 158)">
      <rect width="84" height="26" rx="4" fill="#064e3b"/>
      <text x="42" y="17" fill="#6ee7b7" font-size="10" font-weight="600" text-anchor="middle">🧠 HNSW 1536-D</text>
    </g>
    <g transform="translate(214, 158)">
      <rect width="80" height="26" rx="4" fill="#064e3b"/>
      <text x="40" y="17" fill="#6ee7b7" font-size="10" font-weight="600" text-anchor="middle">🕸️ GraphRAG</text>
    </g>
    <g transform="translate(302, 158)">
      <rect width="70" height="26" rx="4" fill="#064e3b"/>
      <text x="35" y="17" fill="#6ee7b7" font-size="10" font-weight="600" text-anchor="middle">📄 JSON Doc</text>
    </g>

    <text x="40" y="214" fill="#a7f3d0" font-size="10">Direct pointer dereference • Zero network serialization overhead</text>

    <!-- Memory bus arrow -->
    <path d="M 205 238 L 205 252" stroke="#10b981" stroke-width="2"/>
    <polygon points="205,254 201,248 209,248" fill="#10b981"/>

    <!-- Disk Storage Node -->
    <rect x="28" y="254" width="354" height="48" rx="6" fill="#093829" stroke="#34d399" stroke-width="1"/>
    <text x="40" y="274" fill="#ffffff" font-size="11" font-weight="700">🔒 Single Atomic File: app.tapir</text>
    <text x="40" y="291" fill="#6ee7b7" font-size="10">ChaCha20-Poly1305 Encrypted • Zero Daemons • Zero Config</text>

    <!-- Metric Footer -->
    <rect x="18" y="330" width="374" height="74" rx="6" fill="#08281e" stroke="#10b981" stroke-width="1"/>
    <text x="32" y="352" fill="#6ee7b7" font-size="11" font-weight="700">Unmatched Enterprise Performance:</text>
    <text x="32" y="372" fill="#f8fafc" font-size="11">⚡ Latency: <tspan fill="#34d399" font-weight="700">0.55 µs</tspan> chaining / <tspan fill="#34d399" font-weight="700">22.8 µs</tspan> vector search</text>
    <text x="32" y="390" fill="#f8fafc" font-size="11">💾 RAM: <tspan fill="#34d399" font-weight="700">&lt; 4 MB idle</tspan> • Zero sync lag • $0 cloud cost</text>
  </g>
</svg>
