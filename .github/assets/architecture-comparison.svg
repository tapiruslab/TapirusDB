<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 460" width="100%" height="100%" style="background:#FFFFFF; border-radius:16px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif;">
  <defs>
    <!-- Background Grid -->
    <pattern id="lightGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#F1F5F9" stroke-width="1"/>
    </pattern>

    <!-- Subtle Shadows -->
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>

    <!-- Panel Gradients (Light) -->
    <linearGradient id="badPanelLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8F8"/>
      <stop offset="100%" stop-color="#FFF1F2"/>
    </linearGradient>

    <linearGradient id="goodPanelLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6FDF9"/>
      <stop offset="100%" stop-color="#EDFDF5"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1140" height="460" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect width="1140" height="460" fill="url(#lightGrid)"/>

  <!-- ================= LEFT PANEL: THE FRAGILE FRANKENSTACK (LIGHT) ================= -->
  <g transform="translate(28, 22)">
    <rect width="520" height="416" rx="14" fill="url(#badPanelLight)" stroke="#FECDD3" stroke-width="1.4" filter="url(#cardShadow)"/>

    <!-- Header Badge -->
    <rect x="22" y="18" width="216" height="24" rx="12" fill="#FFE4E6" stroke="#FDA4AF" stroke-width="1"/>
    <circle cx="34" cy="30" r="3.5" fill="#E11D48"/>
    <text x="44" y="34" fill="#9F1239" font-size="10" font-weight="700" letter-spacing="0.6">FRAGMENTED MULTI-DAEMON</text>

    <!-- Title & Subtitle -->
    <text x="22" y="66" fill="#0F172A" font-size="18" font-weight="700">The Fragile Frankenstack</text>
    <text x="22" y="84" fill="#64748B" font-size="11.5">3 to 4 disparate databases glued over network sockets &amp; IPC</text>

    <!-- App Node -->
    <g transform="translate(22, 98)">
      <rect width="476" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="21" fill="#0F172A" font-size="11.5" font-weight="600">Your App Process</text>
      <text x="122" y="21" fill="#64748B" font-size="11">(Node.js, Python, Rust, Go)</text>
      <rect x="368" y="5" width="96" height="24" rx="4" fill="#FFF1F2" stroke="#FECDD3" stroke-width="0.8"/>
      <text x="416" y="21" fill="#BE123C" font-size="10" font-weight="600" text-anchor="middle">4 Socket Drivers</text>
    </g>

    <!-- Network Serialization Bottleneck Barrier -->
    <g transform="translate(22, 140)">
      <rect width="476" height="28" rx="6" fill="#FFF1F2" stroke="#F43F5E" stroke-opacity="0.4" stroke-dasharray="4,3"/>
      <text x="238" y="18" fill="#BE123C" font-size="10.5" font-weight="600" text-anchor="middle">⚠️ 40–90 ms Network Roundtrip &amp; Serialization Overhead</text>
    </g>

    <!-- 4 Disparate Server Badges (2x2 Grid) -->
    <g transform="translate(22, 176)">
      <!-- Vector DB -->
      <g transform="translate(0, 0)">
        <rect width="232" height="46" rx="7" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="12" y="19" fill="#0F172A" font-size="11.5" font-weight="600">☁️ Vector DB</text>
        <text x="86" y="19" fill="#64748B" font-size="10">(Pinecone)</text>
        <text x="12" y="34" fill="#E11D48" font-size="9.5">$70–$300/mo • HTTP API hop</text>
      </g>

      <!-- Graph DB -->
      <g transform="translate(244, 0)">
        <rect width="232" height="46" rx="7" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="12" y="19" fill="#0F172A" font-size="11.5" font-weight="600">🕸️ Graph DB</text>
        <text x="84" y="19" fill="#64748B" font-size="10">(Neo4j)</text>
        <text x="12" y="34" fill="#E11D48" font-size="9.5">&gt;1.2GB JVM heap • GC pauses</text>
      </g>

      <!-- Relational SQL -->
      <g transform="translate(0, 52)">
        <rect width="232" height="46" rx="7" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="12" y="19" fill="#0F172A" font-size="11.5" font-weight="600">🗄️ Relational SQL</text>
        <text x="116" y="19" fill="#64748B" font-size="10">(Postgres)</text>
        <text x="12" y="34" fill="#E11D48" font-size="9.5">Port 5432 • Connection pool</text>
      </g>

      <!-- Document Store -->
      <g transform="translate(244, 52)">
        <rect width="232" height="46" rx="7" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="12" y="19" fill="#0F172A" font-size="11.5" font-weight="600">📁 Document / S3</text>
        <text x="118" y="19" fill="#64748B" font-size="10">(MongoDB)</text>
        <text x="12" y="34" fill="#E11D48" font-size="9.5">Dual-write sync drift risk</text>
      </g>
    </g>

    <!-- Scorecard Footer (3 Columns) -->
    <g transform="translate(22, 288)">
      <rect width="476" height="108" rx="8" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1.2"/>
      <text x="16" y="20" fill="#9F1239" font-size="10" font-weight="700" letter-spacing="0.6">ARCHITECTURAL BOTTLENECK SCORECARD</text>

      <g transform="translate(16, 42)">
        <text x="0" y="0" fill="#475569" font-size="11">Query Latency:</text>
        <text x="115" y="0" fill="#E11D48" font-size="13" font-weight="700" font-family="monospace">45 – 95 ms</text>
        <text x="210" y="0" fill="#64748B" font-size="10.5">(WAN network hop)</text>
      </g>
      <g transform="translate(16, 66)">
        <text x="0" y="0" fill="#475569" font-size="11">Idle Memory:</text>
        <text x="115" y="0" fill="#E11D48" font-size="13" font-weight="700" font-family="monospace">&gt; 2,500 MB</text>
        <text x="210" y="0" fill="#64748B" font-size="10.5">(3 background daemons)</text>
      </g>
      <g transform="translate(16, 90)">
        <text x="0" y="0" fill="#475569" font-size="11">Infrastructure:</text>
        <text x="115" y="0" fill="#9F1239" font-size="12" font-weight="700">$$$ Cloud Bills</text>
        <text x="220" y="0" fill="#64748B" font-size="10.5">(Kubernetes / Docker required)</text>
      </g>
    </g>
  </g>

  <!-- ================= CENTER TRANSFORMATION BADGE ================= -->
  <g transform="translate(570, 230)">
    <line x1="0" y1="-185" x2="0" y2="185" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle r="20" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="0" y="4.5" fill="#334155" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.8">VS</text>
  </g>

  <!-- ================= RIGHT PANEL: TAPIRUSDB SOVEREIGN ENGINE (LIGHT) ================= -->
  <g transform="translate(592, 22)">
    <rect width="520" height="416" rx="14" fill="url(#goodPanelLight)" stroke="#A7F3D0" stroke-width="1.5" filter="url(#cardShadow)"/>

    <!-- Header Badge -->
    <rect x="22" y="18" width="220" height="24" rx="12" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
    <circle cx="34" cy="30" r="3.5" fill="#059669"/>
    <text x="44" y="34" fill="#166534" font-size="10" font-weight="700" letter-spacing="0.6">SOVEREIGN IN-PROCESS RUNTIME</text>

    <!-- Title & Subtitle -->
    <text x="22" y="66" fill="#0F172A" font-size="18" font-weight="700">TapirusDB Sovereign Engine</text>
    <text x="22" y="84" fill="#047857" font-size="11.5">Quad-model cognitive memory consolidated in 1 encrypted file</text>

    <!-- Unified Container Card -->
    <g transform="translate(22, 98)">
      <rect width="476" height="178" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.2"/>
      
      <!-- Container Top Info -->
      <g transform="translate(14, 14)">
        <text x="0" y="0" fill="#0F172A" font-size="12.5" font-weight="700">Single File Container: production.tapir</text>
        <text x="0" y="16" fill="#047857" font-size="10.5">Linked directly in host runtime • Zero IPC • Shared In-Memory Address Space</text>
      </g>

      <!-- 4 Unified Models in 1 Row -->
      <g transform="translate(14, 44)">
        <!-- SQL -->
        <g transform="translate(0, 0)">
          <rect width="106" height="60" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8"/>
          <text x="53" y="19" fill="#0F172A" font-size="10.5" font-weight="700" text-anchor="middle">Relational SQL</text>
          <text x="53" y="34" fill="#047857" font-size="9" text-anchor="middle">ANSI SQL-92</text>
          <text x="53" y="48" fill="#065F46" font-size="8.5" text-anchor="middle">ACID B+Tree</text>
        </g>

        <!-- Vectors -->
        <g transform="translate(114, 0)">
          <rect width="106" height="60" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8"/>
          <text x="53" y="19" fill="#0F172A" font-size="10.5" font-weight="700" text-anchor="middle">HNSW Vectors</text>
          <text x="53" y="34" fill="#047857" font-size="9" text-anchor="middle">1536-D SIMD</text>
          <text x="53" y="48" fill="#065F46" font-size="8.5" text-anchor="middle">Sub-ms PQ/IVF</text>
        </g>

        <!-- Graph -->
        <g transform="translate(228, 0)">
          <rect width="106" height="60" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8"/>
          <text x="53" y="19" fill="#0F172A" font-size="10.5" font-weight="700" text-anchor="middle">openCypher</text>
          <text x="53" y="34" fill="#047857" font-size="9" text-anchor="middle">CSR Topology</text>
          <text x="53" y="48" fill="#065F46" font-size="8.5" text-anchor="middle">GraphRAG Fast</text>
        </g>

        <!-- Docs -->
        <g transform="translate(342, 0)">
          <rect width="106" height="60" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8"/>
          <text x="53" y="19" fill="#0F172A" font-size="10.5" font-weight="700" text-anchor="middle">JSON Docs</text>
          <text x="53" y="34" fill="#047857" font-size="9" text-anchor="middle">Schemaless</text>
          <text x="53" y="48" fill="#065F46" font-size="8.5" text-anchor="middle">Hybrid RRF</text>
        </g>
      </g>

      <!-- In-Memory Bus Highlight Bar -->
      <g transform="translate(14, 118)">
        <rect width="448" height="44" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
        <text x="224" y="18" fill="#047857" font-size="10.5" font-weight="700" text-anchor="middle">⚡ 0.51 µs In-Process Memory Bus • 100x Faster Than Network</text>
        <text x="224" y="33" fill="#065F46" font-size="9.5" text-anchor="middle">Atomic 4-Model Transactions • ChaCha20-Poly1305 AEAD • Zero Network Ports</text>
      </g>
    </g>

    <!-- Scorecard Footer (3 Columns) -->
    <g transform="translate(22, 288)">
      <rect width="476" height="108" rx="8" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.2"/>
      <text x="16" y="20" fill="#065F46" font-size="10" font-weight="700" letter-spacing="0.6">PROVEN IN-PROCESS PERFORMANCE GAINS</text>

      <g transform="translate(16, 42)">
        <text x="0" y="0" fill="#475569" font-size="11">Query Latency:</text>
        <text x="115" y="0" fill="#059669" font-size="13" font-weight="700" font-family="monospace">0.51 µs</text>
        <text x="180" y="0" fill="#047857" font-size="10.5">(100x faster in CPU memory)</text>
      </g>
      <g transform="translate(16, 66)">
        <text x="0" y="0" fill="#475569" font-size="11">Idle Memory:</text>
        <text x="115" y="0" fill="#059669" font-size="13" font-weight="700" font-family="monospace">&lt; 4 MB RAM</text>
        <text x="210" y="0" fill="#047857" font-size="10.5">(99.8% lighter footprint)</text>
      </g>
      <g transform="translate(16, 90)">
        <text x="0" y="0" fill="#475569" font-size="11">Infrastructure:</text>
        <text x="115" y="0" fill="#059669" font-size="12" font-weight="700">$0 Cloud Bills</text>
        <text x="210" y="0" fill="#64748B" font-size="10.5">• 100% sovereign, local-first &amp; offline</text>
      </g>
    </g>
  </g>
</svg>
