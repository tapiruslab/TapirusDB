<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720" width="100%" height="100%" style="background:#FFFFFF; border-radius:14px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif;">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="lightGridMob" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#F1F5F9" stroke-width="1"/>
    </pattern>

    <!-- Gradients -->
    <linearGradient id="badPanelLightMob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8F8"/>
      <stop offset="100%" stop-color="#FFF1F2"/>
    </linearGradient>

    <linearGradient id="goodPanelLightMob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6FDF9"/>
      <stop offset="100%" stop-color="#EDFDF5"/>
    </linearGradient>

    <filter id="shadowMob" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="480" height="720" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
  <rect width="480" height="720" fill="url(#lightGridMob)"/>

  <!-- ================= TOP PANEL: THE FRAGILE FRANKENSTACK (LIGHT) ================= -->
  <g transform="translate(18, 18)">
    <rect width="444" height="320" rx="12" fill="url(#badPanelLightMob)" stroke="#FECDD3" stroke-width="1.2" filter="url(#shadowMob)"/>

    <!-- Badge & Header -->
    <rect x="16" y="14" width="200" height="22" rx="11" fill="#FFE4E6" stroke="#FDA4AF" stroke-width="1"/>
    <circle cx="26" cy="25" r="3" fill="#E11D48"/>
    <text x="36" y="29" fill="#9F1239" font-size="9.5" font-weight="700" letter-spacing="0.5">THE FRAGILE FRANKENSTACK</text>

    <text x="16" y="56" fill="#0F172A" font-size="16" font-weight="700">4 Disparate Cloud Servers</text>
    <text x="16" y="73" fill="#64748B" font-size="11">Tangled over remote network sockets &amp; IPC</text>

    <!-- 4 Server Badges (2x2 Grid) -->
    <g transform="translate(16, 86)">
      <!-- Vector DB -->
      <g transform="translate(0, 0)">
        <rect width="200" height="42" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="10" y="18" fill="#0F172A" font-size="11" font-weight="600">☁️ Vector DB (Pinecone)</text>
        <text x="10" y="32" fill="#E11D48" font-size="9">$70–$300/mo API cost</text>
      </g>
      <!-- Graph DB -->
      <g transform="translate(212, 0)">
        <rect width="200" height="42" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="10" y="18" fill="#0F172A" font-size="11" font-weight="600">🕸️ Graph DB (Neo4j)</text>
        <text x="10" y="32" fill="#E11D48" font-size="9">&gt;1.2GB JVM heap memory</text>
      </g>
      <!-- Relational SQL -->
      <g transform="translate(0, 48)">
        <rect width="200" height="42" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="10" y="18" fill="#0F172A" font-size="11" font-weight="600">🗄️ Relational (Postgres)</text>
        <text x="10" y="32" fill="#E11D48" font-size="9">Port 5432 daemon</text>
      </g>
      <!-- Document Store -->
      <g transform="translate(212, 48)">
        <rect width="200" height="42" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="10" y="18" fill="#0F172A" font-size="11" font-weight="600">📁 Document (MongoDB)</text>
        <text x="10" y="32" fill="#E11D48" font-size="9">Dual-write drift risk</text>
      </g>
    </g>

    <!-- Network Bottleneck Warning -->
    <g transform="translate(16, 186)">
      <rect width="412" height="26" rx="5" fill="#FFF1F2" stroke="#F43F5E" stroke-opacity="0.4" stroke-dasharray="3,3"/>
      <text x="206" y="17" fill="#BE123C" font-size="10" font-weight="600" text-anchor="middle">⚠️ 40–90 ms Network Roundtrip &amp; Serialization Overhead</text>
    </g>

    <!-- Scorecard Box -->
    <g transform="translate(16, 222)">
      <rect width="412" height="84" rx="8" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1"/>
      <g transform="translate(14, 24)">
        <text x="0" y="0" fill="#475569" font-size="11">Total Latency:</text>
        <text x="110" y="0" fill="#E11D48" font-size="12.5" font-weight="700" font-family="monospace">45 – 95 ms</text>
        <text x="195" y="0" fill="#64748B" font-size="10">(WAN hop)</text>
      </g>
      <g transform="translate(14, 46)">
        <text x="0" y="0" fill="#475569" font-size="11">Idle Memory:</text>
        <text x="110" y="0" fill="#E11D48" font-size="12.5" font-weight="700" font-family="monospace">&gt; 2.5 GB RAM</text>
        <text x="205" y="0" fill="#64748B" font-size="10">(Multi-daemon)</text>
      </g>
      <g transform="translate(14, 68)">
        <text x="0" y="0" fill="#475569" font-size="11">Infrastructure:</text>
        <text x="110" y="0" fill="#9F1239" font-size="11.5" font-weight="700">$$$ Monthly Cloud Bills</text>
      </g>
    </g>
  </g>

  <!-- ================= CENTER VS BADGE ================= -->
  <g transform="translate(240, 350)">
    <circle r="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadowMob)"/>
    <text x="0" y="4" fill="#334155" font-size="9.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">VS</text>
  </g>

  <!-- ================= BOTTOM PANEL: TAPIRUSDB SOVEREIGN ENGINE (LIGHT) ================= -->
  <g transform="translate(18, 370)">
    <rect width="444" height="332" rx="12" fill="url(#goodPanelLightMob)" stroke="#A7F3D0" stroke-width="1.4" filter="url(#shadowMob)"/>

    <!-- Badge & Header -->
    <rect x="16" y="14" width="200" height="22" rx="11" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
    <circle cx="26" cy="25" r="3" fill="#059669"/>
    <text x="36" y="29" fill="#166534" font-size="9.5" font-weight="700" letter-spacing="0.5">TAPIRUSDB SOVEREIGN ENGINE</text>

    <text x="16" y="56" fill="#0F172A" font-size="16" font-weight="700">1 Encrypted Local File (.tapir)</text>
    <text x="16" y="73" fill="#047857" font-size="11">Quad-model memory unified inside host application process</text>

    <!-- 4 Unified Models (2x2 Grid) -->
    <g transform="translate(16, 86)">
      <!-- SQL -->
      <g transform="translate(0, 0)">
        <rect width="200" height="42" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8"/>
        <text x="10" y="18" fill="#0F172A" font-size="11" font-weight="700">Relational SQL</text>
        <text x="10" y="32" fill="#047857" font-size="9">ANSI SQL-92 • ACID B+Tree</text>
      </g>
      <!-- Vector -->
      <g transform="translate(212, 0)">
        <rect width="200" height="42" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8"/>
        <text x="10" y="18" fill="#0F172A" font-size="11" font-weight="700">HNSW Vectors</text>
        <text x="10" y="32" fill="#047857" font-size="9">1536-D SIMD AVX-512</text>
      </g>
      <!-- Graph -->
      <g transform="translate(0, 48)">
        <rect width="200" height="42" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8"/>
        <text x="10" y="18" fill="#0F172A" font-size="11" font-weight="700">openCypher Graph</text>
        <text x="10" y="32" fill="#047857" font-size="9">CSR Topology • GraphRAG</text>
      </g>
      <!-- Docs -->
      <g transform="translate(212, 48)">
        <rect width="200" height="42" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8"/>
        <text x="10" y="18" fill="#0F172A" font-size="11" font-weight="700">JSON Documents</text>
        <text x="10" y="32" fill="#047857" font-size="9">Schemaless • Hybrid RRF</text>
      </g>
    </g>

    <!-- Speed Callout Bar -->
    <g transform="translate(16, 186)">
      <rect width="412" height="26" rx="5" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
      <text x="206" y="17" fill="#047857" font-size="10" font-weight="700" text-anchor="middle">⚡ 0.51 µs In-Process CPU Bus • Zero Network Sockets</text>
    </g>

    <!-- Scorecard Box -->
    <g transform="translate(16, 222)">
      <rect width="412" height="88" rx="8" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.2"/>
      <g transform="translate(14, 24)">
        <text x="0" y="0" fill="#475569" font-size="11">Total Latency:</text>
        <text x="110" y="0" fill="#059669" font-size="13" font-weight="700" font-family="monospace">0.51 µs</text>
        <text x="165" y="0" fill="#047857" font-size="10">(100x faster in CPU memory)</text>
      </g>
      <g transform="translate(14, 47)">
        <text x="0" y="0" fill="#475569" font-size="11">Idle Memory:</text>
        <text x="110" y="0" fill="#059669" font-size="13" font-weight="700" font-family="monospace">&lt; 4 MB RAM</text>
        <text x="195" y="0" fill="#047857" font-size="10">(99.8% lighter)</text>
      </g>
      <g transform="translate(14, 70)">
        <text x="0" y="0" fill="#475569" font-size="11">Infrastructure:</text>
        <text x="110" y="0" fill="#059669" font-size="11.5" font-weight="700">$0 Cloud Bills</text>
        <text x="190" y="0" fill="#64748B" font-size="10">• 100% offline &amp; sovereign</text>
      </g>
    </g>
  </g>
</svg>
