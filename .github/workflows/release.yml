name: Release Pre-built Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build-and-release:
    needs: verify
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: tapirus-linux-x86_64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: tapirus-linux-aarch64
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact_name: tapirus-macos-x86_64
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: tapirus-macos-aarch64
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: tapirus-windows-x86_64
            use_cross: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Cross (if needed)
        if: matrix.use_cross
        run: |
          mkdir -p ~/.cargo/bin
          curl -sSL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | tar -xz -C ~/.cargo/bin
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build Release Binaries & FFI Libraries
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --locked --release -p tapirus -p tapirus-ffi --target ${{ matrix.target }}
          else
            cargo build --locked --release -p tapirus -p tapirus-ffi --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package Unix Distribution
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist/include
          cp target/${{ matrix.target }}/release/tapirus dist/
          cp -f target/${{ matrix.target }}/release/libtapirus.* dist/ 2>/dev/null || true
          cp include/tapirus.h dist/include/ 2>/dev/null || true
          cp LICENSE README.md dist/
          tar -czvf ${{ matrix.artifact_name }}.tar.gz -C dist .
        shell: bash

      - name: Package Windows Distribution
        if: matrix.os == 'windows-latest'
        run: |
          mkdir -p dist/include
          cp target/${{ matrix.target }}/release/tapirus.exe dist/
          cp -f target/${{ matrix.target }}/release/tapirus.dll dist/ 2>/dev/null || true
          cp -f target/${{ matrix.target }}/release/tapirus.lib dist/ 2>/dev/null || true
          cp include/tapirus.h dist/include/ 2>/dev/null || true
          cp LICENSE README.md dist/
          tar -czvf ${{ matrix.artifact_name }}.tar.gz -C dist .
          powershell -Command "Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact_name }}.zip -Force"
        shell: bash


      - name: Generate checksums, dependency inventory, and build metadata
        run: python scripts/release-metadata.py --artifact-glob '${{ matrix.artifact_name }}.*' --target '${{ matrix.target }}' --output-prefix '${{ matrix.artifact_name }}'

      - name: Attest packaged release provenance
        uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.zip
            ${{ matrix.artifact_name }}.cdx.json
            ${{ matrix.artifact_name }}.build.json

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.zip
            ${{ matrix.artifact_name }}.*.sha256
            ${{ matrix.artifact_name }}.cdx.json
            ${{ matrix.artifact_name }}.build.json
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
