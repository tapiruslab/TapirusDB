name: Release Pre-built Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build-and-release:
    needs: verify
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: tapirus-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact_name: tapirus-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact_name: tapirus-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: tapirus-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: tapirus-windows-x86_64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Release Binaries & FFI Libraries
        run: |
          cargo build --locked --release -p tapirus --target ${{ matrix.target }}
          cargo build --locked --release -p tapirus-ffi --target ${{ matrix.target }}
        shell: bash

      - name: Package Unix Distribution
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist/include
          cp target/${{ matrix.target }}/release/tapirus dist/
          if [ '${{ runner.os }}' = 'Linux' ]; then extension=so; else extension=dylib; fi
          cp "target/${{ matrix.target }}/release/libtapirus.$extension" dist/
          cp include/tapirus.h dist/include/
          cp LICENSE README.md dist/
          tar -czvf ${{ matrix.artifact_name }}.tar.gz -C dist .
        shell: bash

      - name: Package Windows Distribution
        if: matrix.os == 'windows-latest'
        run: |
          mkdir -p dist/include
          cp target/${{ matrix.target }}/release/tapirus.exe dist/
          cp target/${{ matrix.target }}/release/tapirus.dll dist/
          cp target/${{ matrix.target }}/release/tapirus.lib dist/
          cp include/tapirus.h dist/include/
          cp LICENSE README.md dist/
          tar -czvf ${{ matrix.artifact_name }}.tar.gz -C dist .
          powershell -Command "Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact_name }}.zip -Force"
        shell: bash


      - name: Build and package standalone editions
        run: |
          for edition in lite document graph vector; do
            case "$edition" in
              graph) feature=graph-only ;;
              vector) feature=vector-only ;;
              *) feature="$edition" ;;
            esac
            binary="tapirus-$edition"
            artifact="${{ matrix.artifact_name }}-$edition"
            cargo build --locked --release -p tapirus --no-default-features --features "$feature" --bin "$binary" --target '${{ matrix.target }}'
            mkdir -p "dist-$edition"
            if [ "${{ matrix.os }}" = "windows-latest" ]; then
              cp "target/${{ matrix.target }}/release/$binary.exe" "dist-$edition/"
            else
              cp "target/${{ matrix.target }}/release/$binary" "dist-$edition/"
            fi
            cp LICENSE "dist-$edition/"
            cp docs/EDITIONS.md "dist-$edition/"
            tar -czf "$artifact.tar.gz" -C "dist-$edition" .
            if [ "${{ matrix.os }}" = "windows-latest" ]; then
              powershell -Command "Compress-Archive -Path 'dist-$edition/*' -DestinationPath '$artifact.zip' -Force"
            fi
            python scripts/release-metadata.py --artifact-glob "$artifact.*" --target '${{ matrix.target }}' --output-prefix "$artifact"
          done
        shell: bash

      - name: Generate checksums, dependency inventory, and build metadata
        run: python scripts/release-metadata.py --artifact-glob '${{ matrix.artifact_name }}.*' --target '${{ matrix.target }}' --output-prefix '${{ matrix.artifact_name }}'

      - name: Install exact packaged Unix release on native host
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export TAPIRUS_INSTALL_DIR="$RUNNER_TEMP/tapirus-release-install"
          export TAPIRUS_ARCHIVE_PATH="$GITHUB_WORKSPACE/${{ matrix.artifact_name }}.tar.gz"
          export TAPIRUS_CHECKSUM_PATH="$TAPIRUS_ARCHIVE_PATH.sha256"
          bash install.sh
          "$TAPIRUS_INSTALL_DIR/bin/tapirus" --version
          "$TAPIRUS_INSTALL_DIR/bin/tapirus" "$RUNNER_TEMP/release-smoke.tapir" -c 'CREATE TABLE smoke (n INTEGER); INSERT INTO smoke VALUES (42)'
          result="$("$TAPIRUS_INSTALL_DIR/bin/tapirus" "$RUNNER_TEMP/release-smoke.tapir" --json 'SELECT n FROM smoke')"
          test "$result" = '[{"n":{"Integer":42}}]'
          for edition in lite document graph vector; do
            "target/${{ matrix.target }}/release/tapirus-$edition" --version
          done

      - name: Install exact packaged Windows release on native host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE '${{ matrix.artifact_name }}.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'tapirus-release-install'
          ./install.ps1 -InstallDir $destination -ArchivePath $archive -ChecksumPath "$archive.sha256" -NoPath
          & (Join-Path $destination 'bin/tapirus.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows binary failed' }
          $database = Join-Path $env:RUNNER_TEMP 'release-smoke.tapir'
          & (Join-Path $destination 'bin/tapirus.exe') $database -c 'CREATE TABLE smoke (n INTEGER); INSERT INTO smoke VALUES (42)'
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows SQL write failed' }
          $result = & (Join-Path $destination 'bin/tapirus.exe') $database --json 'SELECT n FROM smoke'
          if ($LASTEXITCODE -ne 0 -or $result -ne '[{"n":{"Integer":42}}]') { throw 'Packaged Windows SQL reopen failed' }
          foreach ($edition in @('lite', 'document', 'graph', 'vector')) {
            & "target/${{ matrix.target }}/release/tapirus-$edition.exe" --version
            if ($LASTEXITCODE -ne 0) { throw "Packaged $edition binary failed" }
          }

      - name: Attest packaged release provenance
        uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: ${{ matrix.artifact_name }}*

      - name: Retain distributions for build-only review
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ matrix.artifact_name }}*
          if-no-files-found: error

  publish-release:
    name: Publish complete verified release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify every target, edition, checksum, and source record
        run: python scripts/verify-release-assets.py --directory release-assets --source-head "$(git rev-parse HEAD)"
      - name: Create draft with all assets, then verify downloaded copies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ -n "$draft" ]; then
            test "$draft" = true || { echo 'Refusing to replace an already public release.' >&2; exit 1; }
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --draft --verify-tag --notes-file "docs/releases/$GITHUB_REF_NAME.md" --title "TapirusDB $GITHUB_REF_NAME"
          fi
          gh release download "$GITHUB_REF_NAME" --dir target/release-download
          python scripts/verify-release-assets.py --directory target/release-download --source-head "$(git rev-parse HEAD)"
          gh release edit "$GITHUB_REF_NAME" --draft=false
