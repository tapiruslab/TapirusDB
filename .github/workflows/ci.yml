name: Continuous Integration & Benchmark Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux Universal (Debian, Ubuntu, Fedora, RHEL)"
            os: ubuntu-latest
          - name: "macOS (Apple Silicon & Intel)"
            os: macos-latest
          - name: "Windows (x86_64 MSVC)"
            os: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Compiler & Lints
        run: cargo check --workspace --verbose

      - name: Run Full Test Suite
        run: cargo test --workspace --verbose

  test-alpine-musl:
    name: Test (Linux Alpine musl)
    runs-on: ubuntu-latest
    container:
      image: rust:alpine
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Alpine Build Dependencies
        run: apk add --no-cache musl-dev gcc

      - name: Check Compiler & Lints (musl)
        run: cargo check --workspace --verbose

      - name: Run Full Test Suite (musl)
        run: cargo test --workspace --verbose


  benchmark:
    name: Performance & Latency Benchmark
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Benchmark Suite
        run: |
          cargo bench --bench tapirus_bench
          if [ -f target/tapirus_bench_results.json ]; then
            echo "### 🦛 TapirusDB Benchmark Telemetry Summary" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat target/tapirus_bench_results.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Benchmark Telemetry Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tapirus-benchmark-telemetry
          path: target/tapirus_bench_results.json
          if-no-files-found: warn

