name: Publish SDKs (PyPI & npm)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build only, do not upload to PyPI/npm)'
        required: false
        default: true
        type: boolean
      publish_pypi:
        description: 'Publish Python SDK to PyPI'
        required: false
        default: false
        type: boolean
      publish_npm:
        description: 'Publish Node.js SDK to npm'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publication-tag:
    name: Require a version tag before publishing
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && (inputs.publish_pypi || inputs.publish_npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate publication source
        env:
          RELEASE_REF: ${{ github.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$RELEASE_REF" in
            refs/tags/v*) ;;
            *) echo 'Publication requires a version tag. Use dry_run for branches.' >&2; exit 1 ;;
          esac
          python scripts/check-release-version.py --tag "${RELEASE_REF#refs/tags/}"
          draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/${RELEASE_REF#refs/tags/}" --jq .draft)"
          [ "$draft" = false ] || { echo 'SDK publication requires a completed public GitHub release.' >&2; exit 1; }

  # ============================================================================
  # 1. PYTHON SDK (PyPI via Maturin)
  # ============================================================================
  build-python-wheels:
    needs: verify
    name: Build Python Wheels (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheels via Maturin
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --manifest-path sdks/python/Cargo.toml --locked --release --out dist
          sccache: 'true'
          manylinux: auto

      - name: Install and test wheel on its native host
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: python scripts/test-python-sdk.py --wheel dist

      - name: Upload Python wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.target }}
          path: dist/*.whl

  build-python-sdist:
    needs: verify
    name: Build Python Source Distribution (sdist)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist via Maturin
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --manifest-path sdks/python/Cargo.toml --out dist

      - name: Normalize and compile source distribution with locked dependencies
        run: python scripts/normalize-python-sdist.py --sdist dist --check

      - name: Upload Python sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*.tar.gz

  publish-python:
    name: Publish Python SDK to PyPI
    needs: [build-python-wheels, build-python-sdist, publication-tag]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_pypi && !inputs.dry_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all Python artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Attach Python packages to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # 2. NODE.JS SDK (npm via napi-rs)
  # ============================================================================
  build-nodejs-binaries:
    needs: verify
    name: Build Node.js Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build host native binary
        run: node scripts/build-node-sdk.js

      - name: Test native engine on the target host
        working-directory: sdks/nodejs
        run: npm test

      - name: Install and test the npm tarball as a consumer
        run: npm --prefix sdks/nodejs run test:package

      - name: Upload Node binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-binary-${{ matrix.target }}
          path: sdks/nodejs/*.node

  package-nodejs:
    name: Assemble and verify the multi-platform npm package
    needs: [build-nodejs-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all Node.js binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: node-binary-*
          path: sdks/nodejs
          merge-multiple: true

      - name: Inspect generated binary files
        working-directory: sdks/nodejs
        run: ls -la *.node
        shell: bash

      - name: Test native SDK persistence and bindings
        working-directory: sdks/nodejs
        run: npm test

      - name: Create the npm distribution tarball
        working-directory: sdks/nodejs
        run: |
          node ../../scripts/build-node-sdk.js --license-only
          mkdir -p ../../dist
          npm pack --pack-destination ../../dist

      - name: Install the exact distribution tarball in a fresh consumer
        run: npm --prefix sdks/nodejs run test:package -- --tarball "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error

  publish-nodejs:
    name: Publish the verified npm tarball
    needs: [package-nodejs, publication-tag]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_npm && !inputs.dry_run }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist
      - name: Publish to npm Registry
        run: npm publish dist/*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
