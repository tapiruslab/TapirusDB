[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tapirus"
version = "1.0.0"
authors = [
  { name="Ahmad Faiz", email="faiz@tapirusdb.com" },
]
description = "The Safe-Rust Embedded Multi-Model Database & AI Agent Memory Engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
"Homepage" = "https://tapirusdb.com"
"Documentation" = "https://tapirusdb.com/docs.html"
"Repository" = "https://github.com/tapiruslab/TapirusDB"
"Bug Tracker" = "https://github.com/tapiruslab/TapirusDB/issues"
